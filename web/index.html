<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Ray</title>
<style>html, body { height: 100%; margin: 0; background: #FFFFFF; }</style>
</head>
<body>
<script>
// Cargador: trae la última versión de Ray desde GitHub, así la app se actualiza sola sin reinstalar.
// Sin internet usa la última versión guardada; si no hay ninguna, la que vino dentro del APK.
(function () {
  var URL_APP = 'https://raw.githubusercontent.com/riuk1126/ray/main/web/app.html';
  var done = false;
  function show(html) { if (done) return; done = true; document.open(); document.write(html); document.close(); }
  function cached() { try { return localStorage.getItem('ray_web') || ''; } catch (e) { return ''; } }
  function fallback() {
    var c = cached();
    if (c) { show(c); return; }
    fetch('app.html').then(function (r) { return r.text(); }).then(show);
  }
  var t = setTimeout(fallback, 3500);
  fetch(URL_APP + '?t=' + Date.now(), { cache: 'no-store' }).then(function (r) {
    if (!r.ok) throw new Error('http');
    return r.text();
  }).then(function (html) {
    if (html.indexOf('<!DOCTYPE html>') !== 0 || html.indexOf('RAY_APP_OK') < 0) throw new Error('contenido');
    try { localStorage.setItem('ray_web', html); } catch (e) {}
    clearTimeout(t);
    show(html);
  }).catch(function () { clearTimeout(t); fallback(); });
})();
</script>
</body>
</html>
