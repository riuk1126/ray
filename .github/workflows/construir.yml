# Ray — APK de Android.
# La parte web (web/app.html) la carga la app directo desde GitHub al abrirse: cada cambio en "main" le llega sola al celular.
# El APK solo se rearma cuando cambia la carpeta movil/ y se publica en Releases como Ray.apk; la app lo ofrece con el botón «Actualizar».
# También se puede lanzar a mano desde Actions → "Construir Ray" → Run workflow.
name: Construir Ray

on:
  push:
    branches: [main]
    paths: ['movil/**', '.github/workflows/construir.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Preparar la app
        working-directory: movil
        run: |
          npm install
          rm -rf www android && mkdir www && cp -r ../web/* www/
          V=$(node -p "require('./package.json').version")
          npx cap add android
          cp native/*.java android/app/src/main/java/com/raiki/ray/
          cp -r res/* android/app/src/main/res/
          MF=android/app/src/main/AndroidManifest.xml
          grep -q RECORD_AUDIO $MF || sed -i 's#</manifest>#    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <queries>\n        <intent><action android:name="android.speech.RecognitionService" /></intent>\n        <intent><action android:name="android.intent.action.TTS_SERVICE" /></intent>\n    </queries>\n</manifest>#' $MF
          grep -q 'permission.CAMERA' $MF || sed -i 's#</manifest>#    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n</manifest>#' $MF
          grep -q REQUEST_INSTALL_PACKAGES $MF || sed -i 's#</manifest>#    <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />\n</manifest>#' $MF
          # Icono: los dos ojos de Ray sobre blanco
          sudo apt-get install -y -qq imagemagick >/dev/null 2>&1 || true
          convert -size 432x432 xc:none -fill '#232121' -draw "ellipse 178,216 22,43 0,360" -draw "ellipse 254,216 22,43 0,360" fg.png || true
          convert -size 432x432 xc:white -fill '#232121' -draw "ellipse 160,216 34,66 0,360" -draw "ellipse 272,216 34,66 0,360" full.png || true
          if [ -f fg.png ] && [ -f full.png ]; then
            for d in mdpi:48:108 hdpi:72:162 xhdpi:96:216 xxhdpi:144:324 xxxhdpi:192:432; do
              N=${d%%:*}; R=${d#*:}; L=${R%%:*}; F=${R##*:}; DIR=android/app/src/main/res/mipmap-$N
              [ -d "$DIR" ] || continue
              convert fg.png -resize ${F}x${F} $DIR/ic_launcher_foreground.png || true
              convert full.png -resize ${L}x${L} $DIR/ic_launcher.png || true
              convert full.png -resize ${L}x${L} $DIR/ic_launcher_round.png || true
            done
          fi
          # Cerebro local (sin internet): motor MediaPipe LLM Inference; necesita Android 7 (API 24) o más
          sed -i 's/minSdkVersion = [0-9]*/minSdkVersion = 24/' android/variables.gradle
          # El motor viene compilado con Java 21: Gradle 8.7 o más para correr sobre Java 21
          sed -i 's#distributionUrl=.*#distributionUrl=https\\://services.gradle.org/distributions/gradle-8.7-all.zip#' android/gradle/wrapper/gradle-wrapper.properties
          grep -q 'tasks-genai' android/app/build.gradle || printf "\ndependencies {\n    implementation 'com.google.mediapipe:tasks-genai:0.10.27'\n}\n" >> android/app/build.gradle
          CODE=$(node -p "const [a,b,c]=require('./package.json').version.split('.').map(Number);a*10000+b*100+c")
          sed -i "s/versionCode [0-9]*/versionCode $CODE/; s/versionName \"[^\"]*\"/versionName \"$V\"/" android/app/build.gradle
          npx cap sync android
      - name: Compilar
        working-directory: movil/android
        run: ./gradlew assembleRelease --no-daemon -q
      - name: Firmar y publicar
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BT=$ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)
          $BT/zipalign -p -f 4 movil/android/app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          $BT/apksigner sign --ks movil/ray.jks --ks-key-alias ray --ks-pass pass:ray-raiki-2026 --key-pass pass:ray-raiki-2026 --out Ray.apk aligned.apk
          $BT/apksigner verify Ray.apk && ls -la Ray.apk
          V=$(node -p "require('./movil/package.json').version")
          gh release view "v$V" >/dev/null 2>&1 || gh release create "v$V" --target "${{ github.sha }}" --title "Ray $V" --notes "Ray $V — asistente de voz con carita. Descarga Ray.apk e instálalo en tu celular o tableta Android."
          gh release upload "v$V" Ray.apk --clobber
